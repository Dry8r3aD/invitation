<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>000 ❤️ 000의 결혼식에 초대합니다</title>

    <!-- 🌐 카카오톡 공유용 오픈그래프(OG) 메타 태그 -->
    <meta property="og:title" content="000 ❤️ 000 결혼합니다">
    <meta property="og:description" content="2026년 12월 31일, 저희의 시작을 함께 축하해 주세요.">
    <meta property="og:image" content="https://dry8r3ad.github.io/photophoto.jpg">
    <meta property="og:url" content="https://dry8r3ad.github.io/">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.css" />

    <style>
        @font-face {
            font-family: 'Cafe24Dongdong';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.1/Cafe24Dongdong.woff') format('woff');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cafe24Dongdong', sans-serif; }

        body {
            background-color: #f7f4f0;
            color: #52403c;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(140, 120, 110, 0.06);
        }

        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; pointer-events: none; }

        section { padding: 50px 24px; }
        .main-sec { padding: 60px 24px 40px 24px; }

        .main-title-container { display: flex; justify-content: center; align-items: center; min-height: 3.5rem; margin-bottom: 25px; }
        .main-title { font-size: 2.3rem; font-weight: bold; letter-spacing: 2px; color: #d98b82; }
        .cursor { width: 3px; height: 2.3rem; background-color: #d98b82; margin-left: 5px; animation: blink 0.8s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .main-img { width: 100%; border-radius: 16px; margin: 15px 0 25px 0; }
        .main-names { font-size: 2.1rem; color: #52403c; font-weight: bold; }
        .main-info { font-size: 1.25rem; color: #8c7a70; margin-top: 15px; line-height: 1.6; }

        .dday-sec { padding: 24px 20px; margin: 0 24px 30px 24px; background-color: #faf6f2; border-radius: 16px; border: 1px dashed #decbc0; }
        .dday-title { font-size: 1.1rem; color: #8c7a70; margin-bottom: 15px; font-weight: bold; }
        .dday-timer { display: flex; justify-content: center; gap: 20px; }
        .timer-item { display: flex; flex-direction: column; align-items: center; }
        .timer-num { font-size: 1.7rem; color: #52403c; font-weight: bold; }
        .timer-label { font-size: 0.85rem; color: #decbc0; margin-top: 4px; }

        .intro-sec { background-color: #faf6f2; line-height: 2; font-size: 1.25rem; border-radius: 20px; margin: 0 24px; padding: 45px 20px; color: #665b53; }
        .intro-title { font-size: 1.5rem; color: #8c7a70; margin-bottom: 25px; font-weight: bold; }

        .family-info-container { margin-top: 35px; padding-top: 25px; border-top: 1px dashed #ebdcd0; display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .family-line { font-size: 1.25rem; color: #70635c; display: flex; align-items: center; justify-content: center; }
        .family-parents { font-weight: bold; color: #52403c; }
        .family-dot { font-family: sans-serif !important; font-size: 1.1rem; color: #d98b82; margin: 0 8px; }
        .family-relation { color: #8c7a70; font-size: 1.1rem; margin: 0 10px 0 6px; }
        .family-child { font-size: 1.35rem; font-weight: bold; color: #52403c; }

        .calendar-table { width: 100%; max-width: 320px; margin: 0 auto; border-collapse: collapse; font-size: 1.1rem; }
        .calendar-table th, .calendar-table td { padding: 12px 0; text-align: center; }
        .wedding-day { background-color: #d98b82; color: white !important; border-radius: 50%; }

        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .gallery-grid a { display: block; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 12px; }
        .gallery-grid img { width: 100%; height: 100%; object-fit: cover; }

        .map-btn-container { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
        .map-nav-btn { flex: 1; padding: 14px; font-size: 1.1rem; border-radius: 12px; border: 1px solid #ebdcd0; background-color: white; cursor: pointer; font-weight: bold; }

        .transport-info { text-align: left; background-color: #faf6f2; border-radius: 16px; padding: 28px 24px; margin-top: 30px; line-height: 1.75; }
        .transport-label { font-size: 1.15rem; font-weight: bold; color: #8c7a70; margin-bottom: 8px; }

        .bank-btn { background-color: #d98b82; color: white; border: none; padding: 15px 24px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; margin-top: 15px; width: 90%; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti-canvas"></canvas>

    <section class="main-sec">
        <div class="main-title-container">
            <div class="main-title" id="typing-title"></div>
            <div class="cursor" id="cursor-bar"></div>
        </div>
        <img src="photophoto.jpg" alt="웨딩 메인 사진" class="main-img">
        <div class="main-names">홍길동 <span style="font-size:1.4rem; color:#ebdcd0;">&</span> 성춘향</div>
    </section>

    <div class="dday-sec">
        <div class="dday-title">식장 입장까지 남은 시간 💍</div>
        <div class="dday-timer" id="wedding-timer">
            <div class="timer-item"><span class="timer-num" id="days">00</span><span class="timer-label">일</span></div>
            <div class="timer-item"><span class="timer-num" id="hours">00</span><span class="timer-label">시</span></div>
            <div class="timer-item"><span class="timer-num" id="minutes">00</span><span class="timer-label">분</span></div>
        </div>
    </div>

    <section class="intro-sec">
        <div class="intro-title">소중한 분들을 초대합니다</div>
        <div class="family-info-container">
            <div class="family-line">
                <span class="family-parents">구자철<span class="family-dot">·</span>한가인</span>
                <span class="family-relation">의 장남</span>
                <span class="family-child">길동</span>
            </div>
            <div class="family-line">
                <span class="family-parents">성춘향<span class="family-dot">·</span>이몽룡</span>
                <span class="family-relation">의 장녀</span>
                <span class="family-child">춘향</span>
            </div>
        </div>
    </section>

    <section class="map-sec">
        <div class="intro-title">오시는 길 📍</div>
        <div class="map-btn-container">
            <button class="map-nav-btn" onclick="window.open('https://naver.me/5uIYZdsZ')">네이버 지도</button>
            <button class="map-nav-btn" onclick="window.open('https://map.kakao.com/?q=노블발렌티 삼성점')">카카오 맵</button>
        </div>
        <div class="transport-info">
            <div class="transport-label">🚌 버스 안내</div>
            <div>간선: 143, 301, 351, 401<br>지선: 2415, 3217, 3411, 4318</div>
        </div>
    </section>

    <section class="bank-sec">
        <button class="bank-btn" onclick="copyAccount('국민은행 123456-01-123456')">신랑측 계좌 복사</button>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    window.onload = function() {
        const titleEl = document.getElementById('typing-title');
        const text = "우리 결혼합니다 💕";
        let index = 0;
        function type() {
            if (index < text.length) { titleEl.textContent += text.charAt(index); index++; setTimeout(type, 150); }
        }
        type();

        const targetDate = new Date("2026-12-31T11:00:00+09:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const diff = targetDate - now;
            document.getElementById("days").innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById("minutes").innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        }, 1000);
    };

    function copyAccount(acc) { navigator.clipboard.writeText(acc).then(() => { alert("계좌번호가 복사되었습니다."); }); }
</script>
</body>
</html>
